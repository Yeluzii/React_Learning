<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello React</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- CDN引入，依赖三个包：react、react-dom、babel -->
    <script src="./lib/react.js"></script>
    <script src="./lib/react-dom.js"></script>
    <script src="./lib/babel.js"></script>

    <script type="text/babel">
      const root = ReactDOM.createRoot(document.querySelector("#root"));

      let clickNum = 0;

      const colorList = [
        {
          id: 1,
          color: "red",
        },
        {
          id: 2,
          color: "orange",
        },
        {
          id: 3,
          color: "yellow",
        },
        {
          id: 4,
          color: "green",
        },
        {
          id: 5,
          color: "blue",
        },
        {
          id: 6,
          color: "indigo",
        },
        {
          id: 7,
          color: "purple",
        },
      ];

      const btnClick = () => {
        clickNum++;
        rootRender();
      };

      const rootRender = () => {
        // 计算当前颜色索引
        const colorIndex = (clickNum - 1) % colorList.length;

        root.render(
          <div>
            {/* 动态设置文字颜色 */}
            <h2
              style={{
                color: clickNum === 0 ? "black" : colorList[colorIndex].color,
              }}
            >
              你已经点击了 {clickNum} 次
            </h2>

            {/* 超过10次显示隐藏成就 */}
            {clickNum > 10 && <p>成就达成：你已经解锁隐藏成就！🌈</p>}

            {/* 添加彩虹emoji */}
            <button onClick={btnClick}>点击切换彩虹文本 🌈</button>
          </div>
        );
      };

      rootRender();
    </script>
  </body>
</html>
