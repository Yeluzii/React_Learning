<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello React</title>
    <style>
      .item {
        margin: 10px;
        padding: 0 20px;
        border: 2px solid black;
      }
      .red {
        color: red;
      }
      .green {
        color: green;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- CDN引入，依赖三个包：react、react-dom、babel -->
    <script src="./lib/react.js"></script>
    <script src="./lib/react-dom.js"></script>
    <script src="./lib/babel.js"></script>

    <script type="text/babel">
      const taskList = [
        {
          id: 1,
          name: "吃饭",
          completed: true,
        },
        {
          id: 2,
          name: "睡觉",
          completed: false,
        },
        {
          id: 3,
          name: "敲代码",
          completed: false,
        },
      ];

      const unfinished = taskList.filter(
        (item) => item.completed === false
      ).length;

      const element = (
        <div>
          <h1>任务列表</h1>
          <h2>当前未完成任务：{unfinished} 项</h2>
          <div className="item">
            {taskList.map((item) => (
              <div className="item" key={item.id}>
                <h3>编号：{item.id}</h3>
                <h3>任务：{item.name}</h3>
                <h2>
                  {item.completed ? (
                    <h1 className="green">已完成</h1>
                  ) : (
                    <h1 className="red">未完成</h1>
                  )}
                </h2>
              </div>
            ))}
          </div>
        </div>
      );

      const root = ReactDOM.createRoot(document.querySelector("#root"));
      root.render(element);
    </script>
  </body>
</html>
